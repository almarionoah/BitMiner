# Generated by Automator — builds a preview of the app into the automator-preview/ folder.
name: Automator preview
on:
  push:
    branches: ["automator-preview"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    if: "!contains(github.event.head_commit.message, '[automator-preview-output]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build preview
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
          PUBLIC_URL: "."
        run: |
          set +e
          rm -rf automator-preview
          OUT=""
          export NPM_CONFIG_LEGACY_PEER_DEPS=true
          build_once() {
            if [ -f package.json ]; then
              if [ -f package-lock.json ]; then npm ci --no-audit || npm install --no-audit; else npm install --no-audit; fi
              if [ -f angular.json ]; then
                npx ng build --configuration development --base-href ./ --output-path _pv_out || npm run build
              elif grep -q '"vite"' package.json; then
                npx vite build --mode development --base ./ --outDir _pv_out || npm run build
              elif grep -q '"build"' package.json; then
                npm run build || NODE_OPTIONS=--openssl-legacy-provider npm run build
              else
                true
              fi
            fi
          }
          if ! build_once; then
            echo "::warning::Preview build failed — retrying with legacy OpenSSL support."
            if ! NODE_OPTIONS=--openssl-legacy-provider build_once; then
              echo "::warning::Latest changes do not build — previewing the previous working version."
              git fetch --depth=2 origin HEAD >/dev/null 2>&1 || true
              git diff --name-only HEAD~1 HEAD 2>/dev/null | grep -v '^\.github/' | grep -v '^automator/' | while read -r f; do
                if git cat-file -e "HEAD~1:$f" 2>/dev/null; then git checkout HEAD~1 -- "$f"; else rm -f "$f"; fi
              done
              build_once
            fi
          fi
          for d in _pv_out/browser _pv_out dist/*/browser dist/* dist www build out public build/web web src/main/webapp .; do
            if [ -d "$d" ] && [ -f "$d/index.html" ]; then OUT="$d"; break; fi
          done
          if [ -z "$OUT" ]; then echo "::error::The build produced no index.html to preview"; exit 1; fi
          echo "Preview from $OUT"
          mkdir -p /tmp/pv && rsync -a --exclude .git --exclude .github --exclude node_modules --exclude automator --exclude _pv_out/node_modules "$OUT"/ /tmp/pv/
          mkdir -p automator-preview && cp -a /tmp/pv/. automator-preview/
      - name: Store preview in the repository
        run: |
          git config user.name "Automator Preview"
          git config user.email "preview@automator.app"
          git add -f automator-preview
          git commit -m "Automator preview build [automator-preview-output] [skip ci]" || echo "no changes"
          git push origin HEAD:automator-preview
