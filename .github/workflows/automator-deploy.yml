# Generated by Automator — builds each detected app (frontend/backend) in development configuration and deploys over FTP.
name: Automator deploy
on:
  push:
    branches: ["automator/deploy-**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install (frontend — .)
        working-directory: .
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: if [ -f package-lock.json ]; then npm ci --no-audit || npm install --no-audit; else npm install --no-audit; fi
      - name: Build frontend (development configuration, self-healing)
        working-directory: .
        env:
          CI: "false"
          DISABLE_ESLINT_PLUGIN: "true"
        run: |
          export NPM_CONFIG_LEGACY_PEER_DEPS=true
          if ( npx vite build --mode development ); then exit 0; fi
          if ( NODE_OPTIONS=--openssl-legacy-provider npx vite build --mode development ); then exit 0; fi
          echo "::warning::Build with work-asset changes failed — restoring the original code and rebuilding."
          git -C "$GITHUB_WORKSPACE" diff --name-only HEAD~1 HEAD | grep -v '^\.github/' | grep -v '^automator/' | while read -r f; do
            if git -C "$GITHUB_WORKSPACE" cat-file -e "HEAD~1:$f" 2>/dev/null; then git -C "$GITHUB_WORKSPACE" checkout HEAD~1 -- "$f"; else rm -f "$GITHUB_WORKSPACE/$f"; fi
          done
          if ( npx vite build --mode development ); then exit 0; fi
          echo "::warning::Original code also failed to build — deploying sources as-is."
          exit 0
      - name: Collect frontend output
        working-directory: .
        run: |
          OUT="$GITHUB_WORKSPACE/_automator_deploy"
          mkdir -p "$OUT"
          SRC=""
          for d in dist/*/browser dist/* dist www build out .next/static public/build .; do
            if [ -d "$d" ] && [ -f "$d/index.html" ]; then SRC="$d"; break; fi
          done
          [ -z "$SRC" ] && [ -d dist ] && SRC=dist
          [ -z "$SRC" ] && SRC=.
          echo "Deploying frontend #1 from ./$SRC"
          rsync -a --exclude .git --exclude .github --exclude node_modules --exclude automator --exclude _automator_deploy "$SRC"/ "$OUT"/
          
      - name: Ensure index.html at deploy root
        run: |
          cd _automator_deploy
          if [ ! -f index.html ]; then
            F=$(find . -path ./api -prune -o -name index.html -print | awk '{ print length, $0 }' | sort -n | head -1 | cut -d' ' -f2-)
            if [ -n "$F" ]; then D=$(dirname "$F"); echo "Promoting $D to deploy root"; cp -a "$D"/. ./; fi
          fi
          [ -f index.html ] || { echo "::error::Build produced no index.html — refusing to wipe the FTP folder"; exit 1; }
          ls -la
      - name: Wipe FTP folder and upload build
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.AUTOMATOR_FTP_HOST }}
          username: ${{ secrets.AUTOMATOR_FTP_USER }}
          password: ${{ secrets.AUTOMATOR_FTP_PASS }}
          port: ${{ secrets.AUTOMATOR_FTP_PORT }}
          server-dir: ${{ secrets.AUTOMATOR_FTP_DIR }}
          local-dir: ./_automator_deploy/
          dangerous-clean-slate: true
          state-name: .automator-ftp-sync.json
